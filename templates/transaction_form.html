{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-body">
        <h5 class="card-title mb-3">{{ product.name }} için İşlem</h5>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">İşlem Türü</label>
            <select name="transaction_type" class="form-select" required>
              <option value="purchase">Alım</option>
              <option value="sale">Satış</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Miktar</label>
            <input type="number" class="form-control" name="quantity" min="1" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Birim Fiyat</label>
            <input type="number" step="0.01" class="form-control" name="unit_price" value="{{ product.unit_price }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Not</label>
            <textarea class="form-control" name="note" rows="2"></textarea>
          </div>
          <div class="d-flex justify-content-end">
            <a href="{{ url_for('inventory.product_list') }}" class="btn btn-outline-secondary me-2">İptal</a>
            <button type="submit" class="btn btn-primary">Kaydet</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>Kullanıcılar</h3>
  <a class="btn btn-primary" href="{{ url_for('auth.create_user') }}">Yeni Kullanıcı</a>
</div>
<div class="card">
  <div class="card-body">
    <div class="table-responsive">
      <table class="table">
        <thead>
          <tr>
            <th>Kullanıcı Adı</th>
            <th>Rol</th>
          </tr>
        </thead>
        <tbody>
          {% for user in users %}
          <tr>
            <td>{{ user.username }}</td>
            <td>{{ user.role }}</td>
          </tr>
          {% else %}
          <tr>
            <td colspan="2" class="text-center text-muted">Kayıt yok</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}

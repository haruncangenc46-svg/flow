{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-body">
        <h5 class="card-title mb-3">{{ 'Ürün Güncelle' if product else 'Yeni Ürün' }}</h5>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Ürün Adı</label>
            <input type="text" class="form-control" name="name" value="{{ product.name if product else '' }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Stok Kodu</label>
            <input type="text" class="form-control" name="sku" value="{{ product.sku if product else '' }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Stok Miktarı</label>
            <input type="number" class="form-control" name="quantity" value="{{ product.quantity if product else 0 }}" min="0" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Birim Fiyat</label>
            <input type="number" step="0.01" class="form-control" name="unit_price" value="{{ product.unit_price if product else 0 }}" required>
          </div>
          <div class="d-flex justify-content-end">
            <a href="{{ url_for('inventory.product_list') }}" class="btn btn-outline-secondary me-2">İptal</a>
            <button type="submit" class="btn btn-primary">Kaydet</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
